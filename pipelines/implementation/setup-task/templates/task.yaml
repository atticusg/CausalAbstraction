# Hydra task config for the task `{{TASK_NAME}}`.
# Referenced from a runner's defaults as `- /task: {{TASK_NAME}}`. It lives in the
# `task` config group (the `configs/task/` dir), so Hydra mounts it at cfg.task by
# group-default packaging — no Hydra package directive needed, matching the shipped
# causalab/configs/task/*.yaml (which carry none). The runner's session-code search
# path picks this file up automatically when CAUSALAB_SESSION_CODE points at the
# working directory (scripts/run_exp.sh then appends $WORKDIR/code/configs).

name: {{TASK_NAME}}              # must equal the task package dir name (the loader key)

# Intervention target. `target_variables` (plural) is the canonical shipped key —
# locate reads it first (causalab/analyses/locate/main.py). Several other analyses
# (baseline, activation_manifold, output_manifold, path_steering, pullback) read
# only singular `target_variable`, and resolve_task() raises if it is null. So emit
# BOTH pointing at the same variable (the intermediate / output variable under test,
# from the spec) and keep them in sync.
target_variable: {{TARGET_VARIABLE}}
target_variables: [{{TARGET_VARIABLE}}]

# Generation / decoding
max_new_tokens: {{MAX_NEW_TOKENS}}        # = MAX_NEW_TOKENS in config.py (1 for single-token tasks)

# Dataset sizing (root-level knobs — invariant 12 lives here, never in analyses)
n_train: 1000
n_test: 50
enumerate_all: false            # true only when the input space is small enough to enumerate exhaustively
balanced: false                 # balance the generated dataset over target_variable
resample_variable: all          # "all" = CF resamples every input var; a var name = CF differs in only that one (locate pairwise needs a name)

# Scoring / metrics
intervention_metric: string_match   # "string_match" for single-token answers; "kl" for distributional targets

# Visualization / geometry.
# colormap + colormap2 are resolution-critical: shipped viz/manifold analysis configs
# interpolate ${task.colormap} (subspace, activation_manifold, output_manifold,
# path_steering) and ${task.colormap2} (path_steering), so a resolve pass raises if
# they're absent once one of those analyses joins the DAG.
# distance_function is defensive: no analysis config interpolates it (it's only
# self-referenced inside a task's own isometry: block, which this template omits) and
# path_steering reads it with a default — kept for forward-compat / a manifold task
# that later adds an isometry: block.
colormap: viridis
colormap2: null
distance_function: hellinger
