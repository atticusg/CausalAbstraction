# @package _global_
defaults:
- /base
- /task: natural_domains_arithmetic_weekdays
- /model: llama31_8b
# - /analysis/baseline
# - /analysis/subspace
# - /analysis/activation_manifold
# - /analysis/output_manifold
# - /analysis/path_steering
- /analysis/pullback
- _self_

task:
  target_variable: result

locate:
  layers: [28]

subspace:
  layers: [28]

activation_manifold:
  layers: [28]

path_steering:
  n_extra_pairs: 29
  isometry:
    n_interior_per_pair: 4

pullback:
  # selected_pairs: null (all pairs) — required for t-test aggregates.
  embedding_optim:
    init: linear
    k_opt: 32
    trajectory_param: tps
    tps:
      n_control_points: 10
      smoothness: 0.0
