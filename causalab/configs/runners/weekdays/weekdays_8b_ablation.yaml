# @package _global_
# Attention-head zero-ablation on weekdays (Llama-3.1-8B), all-token span.
# A small layer subgrid keeps the GPU smoke quick while still producing a
# meaningful (layer x head) accuracy-drop heatmap + a joint combo.
defaults:
- /base
- /task: natural_domains_arithmetic_weekdays
- /model: llama31_8b
- /analysis/ablation
- _self_

task:
  target_variable: result

ablation:
  component_type: attention_head
  mode: zero
  span: all
  layers: [0, 14, 28]
  heads: null            # all heads
  batch_size: 16
  combos:
  - [[14, 0], [14, 1]]
