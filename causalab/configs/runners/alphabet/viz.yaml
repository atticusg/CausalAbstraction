# @package _global_
defaults:
- /base
- /task: natural_domains_arithmetic_alphabet
- /model: llama31_70b
# - /analysis/baseline
# - /analysis/locate
# - /analysis/subspace
# - /analysis/activation_manifold
# - /analysis/output_manifold
# - /analysis/path_steering
- /analysis/pullback
- _self_

task:
  target_variable: result
  n_train: 1000
  n_test: 1000

locate:
  layers: [77]

subspace:
  layers: [77]

activation_manifold:
  layers: [77]
  intrinsic_mode: parameter

output_manifold:
  intrinsic_mode: parameter

path_steering:
  # replot_only: true

  num_steps_along_path: 500
  selected_pairs:
    - ["G", "Z"]

  path_visualization:
    colored_concepts_in_legend: ["G", "J", "M", "P", "S", "V", "Z"]
    figsize: [6, 4.5]

pullback:
  embedding_optim:
    n_steps: 50
  selected_pairs:
    - ["G", "Z"]
  k_opt: [26]

