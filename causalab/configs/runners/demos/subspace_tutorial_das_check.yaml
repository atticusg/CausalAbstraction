# @package _global_
defaults:
- /base
- /task: MCQA
- /model: llama32_1b_instruct
- /analysis/subspace
- _self_
task:
  target_variable: answer
  enumerate_all: true

subspace:
  method: das
  k_features: 16
  layers: [0, 5, 10, 15]
  token_positions: [last_token]   # explicit grid positions (was the [last_token] default; #257)
  das:
    training_epoch: 4
    lr: 0.001
