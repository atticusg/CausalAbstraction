# @package _global_
defaults:
  - /base
  - /task: MCQA
  - /model: llama32_1b_instruct
  - /analysis/locate
  - _self_
task:
  enumerate_all: true  # use all possible MCQA inputs (deterministic)
  target_variable: answer

locate:
  method: interchange
  mode: centroid      # centroid is correct with resample_variable: all (docs/CODEBASE.md §5)
  layers: null        # null = scan all hidden layers
  n_steer: 32
