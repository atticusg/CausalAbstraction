# @package _global_
defaults:
- /base
- /task: natural_domains_arithmetic_weekdays
- /model: llama31_8b
- /analysis/subspace
- _self_
task:
  target_variable: result
  enumerate_all: true # training on all possible examples, test = train
  resample_variable: entity

subspace:
  method: pca
  layers: [0, 8, 16, 24]
  token_positions: [last_token]   # explicit grid positions (was the [last_token] default; #257)
  k_features: 4
