# @package _global_
defaults:
  - /base
  - /task: MCQA
  - /model: llama32_1b_instruct
  - /analysis/subspace
  - _self_

task:
  enumerate_all: true
  target_variable: answer

subspace:
  method: dbm
  k_features: 32                # k = head_dim or hidden_size; tie_masks=True selects whole units
  layers: null                  # auto-resolved per mode below
  dbm:
    training_epoch: 20
    lr: 0.001
    regularization_coefficient: 0.1
    tie_masks: true             # binary on/off per unit — reproduces the reference's binary-mask heatmap

  modes:
    - name: dbm_attention
      component_type: attention_head
      layers: null              # all layers (resolved at runtime)
      heads: null               # all heads
      token_position: last_token

    - name: dbm_mlp
      component_type: mlp
      layers: null
      token_positions: [correct_symbol, correct_symbol_period, last_token]
