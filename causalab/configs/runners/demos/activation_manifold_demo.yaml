# @package _global_
defaults:
- /base
- /task: MCQA
- /model: llama32_1b_instruct
- /analysis/activation_manifold
- _self_
task:
  target_variable: answer
  n_train: 64
  n_test: 16

activation_manifold:
  intrinsic_mode: parameter
  method: spline
  smoothness: 0.0
  subspace: pca_k16
  skip_decoding_eval: false
    # Grid-mode subspace cell selection (null = auto-resolve to best cell):
  layers: [10]
  token_positions: [last_token]
