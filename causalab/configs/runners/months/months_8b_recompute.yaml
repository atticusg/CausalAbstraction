# @package _global_
# Recompute output_manifold viz + isometry + pullback after the sphere-aware
# spline patch. Skips baseline/subspace/activation_manifold (unchanged).
defaults:
- /base
- /task: natural_domains_arithmetic_months
- /model: llama31_8b
# - /analysis/baseline
# - /analysis/subspace
# - /analysis/activation_manifold
- /analysis/output_manifold
- /analysis/path_steering
- /analysis/pullback
- _self_

task:
  target_variable: result

locate:
  layers: [28]

subspace:
  layers: [28]

activation_manifold:
  layers: [28]

path_steering:
  isometry:
    n_interior_per_pair: 1

pullback:
  embedding_optim:
    init: linear
    trajectory_param: tps
    norm_reg_weight: 5.0e-4
