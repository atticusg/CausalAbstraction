# @package _global_
defaults:
- /base
- /task: natural_domains_arithmetic_months
- /model: llama31_8b
# - /analysis/baseline
# - /analysis/subspace
# - /analysis/activation_manifold
# - /analysis/output_manifold
- /analysis/path_steering
# - /analysis/pullback
- _self_

task:
  target_variable: result

locate:
  layers: [28]

subspace:
  layers: [28]

activation_manifold:
  layers: [28]

path_steering:
  eval_criteria:
    - isometry
    - coherence
    - distance_from_behavior_manifold
  isometry:
    n_interior_per_pair: 1
  path_visualization:
    colored_concepts_in_legend: [
      "January", "February", "March", "April", "May", "June",
      "July", "August", "September", "October", "November", "December"
    ]
    figsize: [6, 4.5]
