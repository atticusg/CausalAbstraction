# @package _global_
defaults:
- /base
- /task: natural_domains_arithmetic_months
- /model: llama31_8b
# - /analysis/baseline
# - /analysis/locate
# - /analysis/subspace
# - /analysis/activation_manifold
# - /analysis/output_manifold
# - /analysis/path_steering
- /analysis/pullback
- _self_

task:
  target_variable: result

locate:
  layers: [28]

subspace:
  layers: [28]

activation_manifold:
  layers: [28]

path_steering:
  replot_only: true

  selected_pairs:
    - ["January", "July"]
  num_steps_along_path: 300

  path_visualization:
    colored_concepts_in_legend: [
      "January", "March", "May", "July", "September", "November"
    ]
    figsize: [6, 4.5]


pullback:
  replot_only: false
  selected_pairs:
    # - ["January", "June"]
    # - ["January", "August"]
    - ["March", "August"]
    # - ["March", "September"]
    # - ["March", "October"]
  embedding_optim:
    n_steps: 25
    k_opt: [16, 24]
    init: geometric
