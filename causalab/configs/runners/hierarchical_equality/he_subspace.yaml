# @package _global_
defaults:
- /base
- /task: hierarchical_equality
- /model: llama31_8b
- /analysis/subspace
- _self_
task:
  n_train: 200
  n_test: 50
  target_variables:
  - left_equality
  - right_equality
  - result_equality

subspace:
  batch_size: 4
  k_features: 8
  method: pca
  layers: [15]
  token_positions: [last]   # explicit single-cell position (#257)
  das:
    training_epoch: 1
  visualization:
    vis_dims:
    detailed_hover: true
    max_hover_chars: 50
