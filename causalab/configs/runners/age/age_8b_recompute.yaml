# @package _global_
# Recompute output_manifold viz + isometry + pullback after sphere-aware patch.
defaults:
- /base
- /task: natural_domains_arithmetic_age
- /model: llama31_8b
- /analysis/output_manifold
- /analysis/path_steering
- /analysis/pullback
- _self_

task:
  target_variable: result
  n_train: 1000
  n_test: 1000

locate:
  layers: [28]

subspace:
  layers: [28]

activation_manifold:
  layers: [28]
  intrinsic_mode: parameter

output_manifold:
  intrinsic_mode: parameter

path_steering:
  num_steps_along_path: 250

pullback:
  embedding_optim:
    init: linear
    trajectory_param: tps
    norm_reg_weight: 1.0e-3
