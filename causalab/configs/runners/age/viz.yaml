# @package _global_
defaults:
- /base
- /task: natural_domains_arithmetic_age
- /model: llama31_8b
# - /analysis/baseline
# - /analysis/locate
# - /analysis/subspace
# - /analysis/activation_manifold
# - /analysis/output_manifold
# - /analysis/path_steering
- /analysis/pullback
- _self_

task:
  target_variable: result
  n_train: 1000
  n_test: 1000

locate:
  layers: [28]

subspace:
  layers: [28]

activation_manifold:
  layers: [28]
  intrinsic_mode: parameter

output_manifold:
  intrinsic_mode: parameter

path_steering:
  replot_only: true
  num_steps_along_path: 500
  selected_pairs:
    - ["10", "100"]

  path_visualization:
    colored_concepts_in_legend: ["10", "25", "40", "55", "70", "85", "100"]
    figsize: [6, 4.5]
    pca_components: [0,1,2]

pullback:
  selected_pairs:
    - ["10", "100"]
  embedding_optim:
    n_steps: 50
    k_opt: [90]
