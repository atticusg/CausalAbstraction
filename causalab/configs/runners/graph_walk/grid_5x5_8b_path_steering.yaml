# @package _global_
defaults:
- /base
- /task: graph_walk_grid_5x5
- /model: llama31_8b
# - /analysis/baseline
# - /analysis/subspace
# - /analysis/activation_manifold
# - /analysis/output_manifold
- /analysis/path_steering
# - /analysis/pullback
- _self_

task:
  target_variable: node_coordinates

locate:
  layers: [28]
  batch_size: 8

subspace:
  layers: [28]
  k_features: 64
  batch_size: 8
  token_positions: [last]

activation_manifold:
  layers: [28]
  intrinsic_mode: parameter
  intrinsic_dim: 2
  batch_size: 8
  token_positions: [last]

path_steering:
  batch_size: 16
  num_steps_along_path: 15
  n_prompts: 5
  isometry:
    n_interior_per_pair: 1
