# @package _global_
defaults:
- /base
- /task: graph_walk_cylinder_9x9
- /model: llama31_8b
# - /analysis/baseline
# - /analysis/subspace
# - /analysis/activation_manifold
- /analysis/output_manifold
# - /analysis/path_steering
# - /analysis/pullback
- _self_

task:
  target_variable: node_coordinates

baseline:
  batch_size: 8

subspace:
  layers: [28]
