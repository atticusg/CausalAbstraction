# @package _global_
# Recompute output_manifold viz + isometry after sphere-aware patch.
# No pullback — still OOM-blocked on graph_walk's 2048-ctx + autograd graph.
defaults:
- /base
- /task: graph_walk_grid_5x5
- /model: llama31_8b
- /analysis/output_manifold
- /analysis/path_steering
- _self_

task:
  target_variable: node_coordinates

locate:
  layers: [28]
  batch_size: 8

subspace:
  layers: [28]
  k_features: 64
  batch_size: 8
  token_positions: [last]

activation_manifold:
  layers: [28]
  intrinsic_mode: parameter
  intrinsic_dim: 2
  batch_size: 8
  token_positions: [last]

output_manifold:
  intrinsic_mode: parameter
  intrinsic_dim: 2
  batch_size: 8

path_steering:
  batch_size: 16
  num_steps_along_path: 15
  n_prompts: 5
