name: subject_object_relations

# Factory selector: which of the 35 bundled LRE relations to load.
# Override per run with `task.relation=<name>` (see data/manifest.json for names).
# Default is a curation-green relation (see README.md): word_first_letter clears
# the accuracy gate on chat-coherent and is the golden-pinned relation.
relation: word_first_letter

# Intervention target — the object identity (the relation's answer).
target_variable: object
target_variables: [object]

# Generation / decoding. Objects are graded first-token / prefix-aware, so a
# single new token suffices (match_modes={"object": "prefix"} on the model).
max_new_tokens: 1

# Dataset sizing (root-level knobs — invariant 12).
n_train: 64
n_test: 16
enumerate_all: false            # sample via the object-flip generate_dataset
balanced: false
resample_variable: all

# Scoring / metrics
intervention_metric: string_match

# Visualization / geometry. colormap/colormap2 are resolution-critical for
# viz/manifold analyses (${task.colormap*} interpolations); distance_function is
# defensive (kept for a future isometry: block).
colormap: viridis
colormap2: null
distance_function: hellinger
