# @package characterize_subspace
_name_: characterize_subspace
_subdir: ${.subspace.site}_L${.subspace.layer}_k${.subspace.k_features_hint}
_output_dir: ${experiment_root}/characterize_subspace/${._subdir}

subspace:
  # Provide exactly one of `artifact` (a ready rotation) or `source` (built
  # under the analysis output dir). `source` is one of:
  #   {sae_checkpoint, clusters_path, cluster_id, orthonormalize}  # vanilla SAE cluster (via methods.sae.decoder_subspace)
  #   {block_sae_checkpoint, block_id}                             # block/Grassmannian SAE block (one K-dim Stiefel frame)
  artifact: null               # path to .safetensors holding the rotation
  source: null                 # see the two source kinds above
  model: ???                   # HuggingFace model id
  layer: ???                   # block index (0-based, after the embedding)
  site: residual               # residual | attn-out | mlp-out (only residual implemented)
  k_features_hint: auto        # int or "auto"; required-int when the rotation tensor is square
  step1_dataset: ???           # path to JSON list[str] (task-name path is TODO)

significance:
  hypothesis_text: null
  figure_path: null
  topology_description: null

webtext:
  corpus: HuggingFaceFW/fineweb-edu
  split: train
  n_tokens: 1_000_000
  max_seq_len: 256
  batch_size: 32
  n_quantile_bins: 10          # also Figure-2's decile count
  samples_per_bin: 3
  topk: 50
  bottomk: 50
  cache: true
  context_window: 25           # ±W tokens around each doc's peak (max-signed) token
  histogram_nbins: 40          # bins in the projection-explorer histogram
  max_docs_embedded: 5000      # cap on per-doc JSON embedded in the explorer figure (LOGGED when applied)

metrics:
  # TODO(threshold-recheck): the gate now scores max-signed-token projections
  # (issue #210); this threshold was tuned for mean-pooled distributions.
  reproduction_pass_threshold: 0.5

judge:
  provider: openrouter         # openrouter | openai (env-var driven)
  model: anthropic/claude-sonnet-4-5
  framings: [default, broad, contrastive]
  max_reconciliation_iterations: 3
  max_tokens: 4096

output:
  emit_evidence_bundle: true
