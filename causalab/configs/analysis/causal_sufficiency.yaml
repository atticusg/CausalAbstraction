# @package causal_sufficiency
_name_: causal_sufficiency
_subdir: ${.restore.component_type}_${.corruption.kind}
# The analysis appends a sanitized restore-`span` token to the output dir (e.g.
# .../causal_sufficiency/residual_noise_last_token) so runs differing only in the
# restore span don't collide; `span` can be a list, which has no clean Hydra
# interpolation form, so it is folded in by main.py rather than via ${._subdir}.
_output_dir: ${experiment_root}/causal_sufficiency/${._subdir}

# --- corruption: the broken-behaviour floor -------------------------------------
corruption:
  kind: noise            # zero | mean | noise
  layer: -1              # residual-stream layer to corrupt; -1 = embeddings / block-0 input (ROME)
  span: all              # "all" (every token) or a list of task token-position names.
                         # All three kinds may span multiple tokens: zero/mean broadcast
                         # one vector; `noise` adds independent per-token Gaussian via the
                         # dynamic noise intervention (the whole multi-token subject).
  noise_scale: 3.0       # used only when kind == noise. MULTIPLE of the subject-embedding
                         # std sigma (ROME's nu = 3*sigma), estimated from the entry-span
                         # activations — not a raw multiplier.
  noise_seed: 0          # reproducible seeded Gaussian draw

# --- restore grid: the site swept one cell at a time ----------------------------
restore:
  component_type: residual   # attention_head | attention_output | mlp | residual
  layers: null               # list[int] or null = all layers (the cell CENTER layers)
  heads: null                # list[int] or null = all heads (attention_head only)
  span: [last_token]         # restored sites. Restoration is per-example clean, so each
                             # named position must resolve to a SINGLE token (one
                             # (layer, token) cell). Set to your task's positions.
  window: 1                  # restore a centered band of consecutive layers per cell.
                             # 1 = single state (residual trace); ROME uses ~10 for the
                             # MLP/attention severed traces.

# --- recovery metric ------------------------------------------------------------
metric:
  kind: prob                 # prob (softmax P(answer), ROME) | logit_diff | logit
  answer_variable: null      # prob/logit: ex["input"][answer] token (set to your task's variable)
  correct_variable: null     # logit_diff: ex["input"][correct] - ex["input"][distractor] logits
  distractor_variable: null  #   (e.g. IO / name_C)

normalize: recovery          # recovery = (restored - corrupted_floor);
                             # fraction = (restored - floor) / (clean_ceiling - floor)
batch_size: 16
top_k: 20

visualization:
  figure_format: ${figure_format}   # png or pdf — invariant 6
