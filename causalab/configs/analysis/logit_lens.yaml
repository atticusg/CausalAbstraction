# @package logit_lens
_name_: logit_lens
_output_dir: ${experiment_root}/logit_lens

layers: null               # list[int] of residual-stream layers, or null = all layers
top_k: 10                  # number of top tokens retained per (sample, layer, position)
batch_size: 32
apply_final_norm: true     # apply the model's final layer norm before unembedding
                           # (the faithful logit lens); false inspects the raw projection

visualization:
  figure_format: ${figure_format}
  heatmap: true            # render the single-example (layer × token) top-1-token heatmap
