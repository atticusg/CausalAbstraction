# @package locate
_name_: locate
_subdir: ${.method}
_output_dir: ${experiment_root}/locate/${._subdir}

method: interchange
batch_size: 32
layers: null
token_positions: null      # list of token-position names from the task; null = all
component: residual_stream
mode: pairwise             # "pairwise" (default) scores each cell against the
                          # causal model's expected counterfactual label (or, with
                          # intervention_metric: output_shift, against the base
                          # output). "centroid" compares to per-class averages.
n_steer: 50
source_model: null         # set to a model name to enable cross-model patching;
                           # activations are then collected from this model and
                           # patched into the primary model (cfg.model.name).

prescan:                   # attribution-patching fail-fast gate (#456), pairwise only
  enabled: false           # one-backward gradient x delta-activation scores every cell;
  top_k: 10                # exact interchange then runs only on the top-k survivors
  n_examples: null         # cap on counterfactual pairs scored; null = full test set

visualization:
  figure_format: ${figure_format}
  single_pair_trace: true

dbm:                         # used when method: dbm_binary
  training_epoch: 20
  lr: 0.001
  regularization_coefficient: 100  # locate-side default; subspace uses a different one
