# @package path_patching
_name_: path_patching
_subdir: ${.corruption}_${.relative_to_base}
_output_dir: ${experiment_root}/path_patching/${._subdir}

# Sender grid: attention heads (the (layer x head) heatmap axes). null = all.
layers: null                     # list[int] or null = all layers
heads: null                      # list[int] or null = all heads

# Sender + internal-receiver read position. null/last_token = the final token
# (IOI Fig. 3/4 readout). Set to a task position name to move *both* the sender
# and the receiver there — e.g. name_C ("S2", the repeated subject) for the
# Fig. 5 Duplicate-Token / Induction -> S-Inhibition-value edge, whose signal is
# computed at S2 rather than the final token.
token_position: null             # null | last_token | <task position name, e.g. name_C>

# Receiver of the patched edge. Default = the output logits (single intervened
# forward). Internal receivers use the two-pass collect/inject runner and read at
# `token_position`; results land in a receiver-tagged subdir so they never clobber
# the output sweep.
#   output           -> direct effect on the logits (IOI Fig. 3 head sweep)
#   head_value_input -> a head's value vector; needs receiver.layer + receiver.head
#   head_query_input -> a head's query vector; needs receiver.layer + receiver.head
#                       (IOI Fig. 4 S-Inhibition -> Name-Mover query edge)
#   mlp_input        -> the MLP sublayer input; needs receiver.layer
#   residual         -> a residual-stream position; needs receiver.layer
#                       (receiver.residual_point: block_output (default) | block_input)
receiver:
  kind: output                   # output | head_value_input | head_query_input | mlp_input | residual
  layer: null                    # required for internal receivers
  head: null                     # required for head_value_input / head_query_input
  residual_point: block_output   # used only when kind == residual
  # Receiver *set* (IOI Fig. 4 / Fig. 5): a sender patched into several heads at
  # once, collected and injected simultaneously (NOT summed over single receivers —
  # the metric is nonlinear and the receivers interact downstream). When `heads` is
  # a list of [layer, head] pairs the sweep runs the receiver-set two-pass and the
  # `head` above is ignored. Only head_query_input / head_value_input support sets,
  # and every member reads at `token_position`. Example:
  #   kind: head_query_input
  #   heads: [[9, 6], [9, 9], [10, 0]]   # name-mover queries @ END
  heads: null                    # null = single receiver; list[[layer, head]] = a set

# Restorer composition = the estimand. Component families frozen above the sender:
#   [attention, mlp] -> strict residual-stream-to-output direct effect
#   [attention]      -> MLPs/LayerNorm recompute (Wang et al. 2022 §3.1 direct effect)
restore: [attention, mlp]

# Counterfactual source ("corruption"):
#   abc         -> all three names replaced by distinct randoms (paper §3.1)
#   answer_flip -> resample `resample_variable` only (flips the answer)
corruption: abc
resample_variable: name_C        # used only when corruption == answer_flip

# Logit-difference metric: direct effect on logit[correct] - logit[distractor].
correct_variable: IO             # input variable holding the correct answer
distractor_variable: name_C      # input variable holding the distractor answer
relative_to_base: true           # report base - patched (the direct effect)

batch_size: 8
top_k: 20

visualization:
  figure_format: ${figure_format}   # png or pdf — invariant 6
