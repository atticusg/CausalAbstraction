seed: 42
experiment_root: artifacts/${task.name}/${model.id}

# Default static-figure output format (png or pdf) for the whole run. Analysis
# configs interpolate this via `visualization.figure_format: ${figure_format}`,
# so PNG is the single source of truth; override per-analysis or here for PDF.
figure_format: png

slurm:
  time: "04:00:00"

hydra:
  run:
    dir: .
  output_subdir: null
