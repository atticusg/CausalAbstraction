# @package _global_
# Minimal subspace(method:fixed)-only runner — tiny-random / CPU.
#
# Used by tests/end_to_end/test_fixed_subspace.py to check that a NON-orthonormal
# given rotation is orthonormalized so the saved bundle is self-consistent (the
# manifold frame and the path_steering featurizer frame can't diverge). The
# rotation path is injected by the test via `subspace.fixed.artifact=<tmp>`.
#
# NOT under smoke/ or golden/, so `enumerate_e2e_configs` does not auto-collect it.
defaults:
- /base
- /task: natural_domains_arithmetic_weekdays
- /model: tiny-random
- /analysis/subspace
- _self_

task:
  target_variable: result
  n_train: 49
  n_test: 2

subspace:
  method: fixed
  k_features: 8
  layers: [1]
  token_positions: [last_token]   # explicit single-cell position (#257)
  batch_size: 8
  fixed:
    artifact: null     # injected by the test
