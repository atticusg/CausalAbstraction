# @package _global_
# Golden PCA pin for the `exploration` analysis — chat-coherent (Qwen3-4B-Instruct).
#
# Runs exploration `pca` mode over a fixed in-code set of arithmetic prompts and
# pins the residual-stream PCA's explained_variance_ratio at the `=` token (whose
# residual encodes the computed sum, so it carries real cross-input variance on a
# coherent model). The inputs are built on the fly and injected to tmp_path by
# tests/end_to_end/test_exploration_pca.py (exploration.pca.{inputs,essential_tokens});
# this file leaves them null.
#
# NOT a smoke/ or golden/ config: it lives directly under configs/ so
# `enumerate_e2e_configs` does not auto-collect it (it can't run without the test
# injecting the input paths, and the auto golden harness can't pin EVR — it lives
# in a .meta.json sidecar, not results.json/safetensors). Composed by the bespoke
# golden test via `load_e2e_runner_config("exploration_pca")`. See docs/TESTS.md.
defaults:
- /base
- /model: chat-coherent
- /analysis/exploration
- _self_

exploration:
  mode: pca
  pca:
    inputs: null            # injected by the test (tmp pca_inputs.json)
    essential_tokens: null  # injected by the test (tmp essential_tokens.json)
    n_components: 5
    layers: "8,16"          # comma-separated layer indices (the analysis' CLI-derived contract)
    batch_size: 8
