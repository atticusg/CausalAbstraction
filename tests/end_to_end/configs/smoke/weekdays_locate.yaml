# @package _global_
# Smoke-tier locate runner for weekdays.
#
# Smoke configs pin `/model: tiny-random` and assert only that the runner
# completes and writes its declared `expected_artifacts` — value pins and
# determinism live in the golden tier (chat-coherent). See docs/TESTS.md
# "Smoke vs golden split".
defaults:
- /base
- /task: natural_domains_arithmetic_weekdays
- /model: tiny-random
- /analysis/baseline   # locate looks up baseline accuracy + ref dists if cached
- /analysis/locate
- _self_

task:
  target_variable: result
  n_train: 2
  n_test: 2

baseline:
  batch_size: 2

locate:
  layers: [0, 1]
  n_steer: 2
  batch_size: 2

# Artifacts asserted by test_smoke.py::test_runner_smoke, relative to
# experiment_root. Paths bake in the variant subdirs that come from this
# config's knobs — a rename in any interpolation breaks the smoke tier
# loudly, which is the point: smoke is the canary for analysis contract drift.
expected_artifacts:
- locate/interchange/metadata.json
- locate/interchange/results.json
