# @package _global_
# Smoke-tier logit-lens runner for weekdays.
#
# Smoke configs pin `/model: tiny-random` and assert only that the runner
# completes and writes its declared `expected_artifacts` — value pins and
# determinism live in the golden tier (chat-coherent). See docs/TESTS.md
# "Smoke vs golden split". This exercises the nnterp-routed logit-lens path
# (project_on_vocab via StandardizedTransformer; #461) end-to-end on CPU.
defaults:
- /base
- /task: natural_domains_arithmetic_weekdays
- /model: tiny-random
- /analysis/logit_lens
- _self_

task:
  target_variable: result
  n_train: 2
  n_test: 2

logit_lens:
  layers: [0, 1]
  top_k: 3
  batch_size: 2
  visualization:
    heatmap: false   # random-init top-1 heatmap is garbage; skip for a clean smoke

# Artifacts asserted by test_smoke.py::test_runner_smoke, relative to
# experiment_root. A rename in any interpolation breaks the smoke tier loudly.
expected_artifacts:
- logit_lens/metadata.json
- logit_lens/analysis_metadata.json
- logit_lens/top_k/0__last.safetensors
