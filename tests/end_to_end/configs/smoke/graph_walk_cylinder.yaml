# @package _global_
# Smoke-tier baseline runner; coverage-oriented, not a scientific run.
# tiny-random + existence-only asserts (see docs/TESTS.md "Smoke vs golden split").
defaults:
- /base
- /task: graph_walk_cylinder_9x9
- /model: tiny-random
- /analysis/baseline
- _self_

task:
  target_variable: node_coordinates
  n_train: 2
  n_test: 2

# graph_walk has a 2048-token context; keep batch_size small.
baseline:
  batch_size: 2

expected_artifacts:
- baseline/metadata.json
- baseline/accuracy.json
