# @package _global_
# Smoke-tier ablation runner for weekdays — attention heads, zero-ablation,
# all-token span (exercises length-bucketing), plus a joint combo.
#
# Smoke configs pin `/model: tiny-random` and assert only that the runner
# completes and writes its declared `expected_artifacts`. See docs/TESTS.md
# "Smoke vs golden split".
defaults:
- /base
- /task: natural_domains_arithmetic_weekdays
- /model: tiny-random
- /analysis/ablation
- _self_

task:
  target_variable: result
  n_train: 2
  n_test: 2

ablation:
  component_type: attention_head
  mode: zero
  span: all
  layers: [0, 1]
  heads: [0, 1]
  batch_size: 2
  combos:
  - [[0, 0], [1, 1]]

expected_artifacts:
- ablation/attention_head_zero_all/metadata.json
- ablation/attention_head_zero_all/results.json
- ablation/attention_head_zero_all/heatmap.png
