# @package _global_
# Smoke-tier locate runner with the attribution-patching pre-scan gate (#456).
#
# Twin of weekdays_locate.yaml with locate.prescan enabled: the one-backward
# gradient x delta-activation pre-scan scores every (layer, position) cell on
# tiny-random, prunes the grid to top_k, and exact interchange runs on the
# survivors only. Asserts the gated chain completes and writes its artifacts
# (incl. the prescan block inside results.json and the prescan heatmap);
# value pins live in the golden twin (weekdays_locate_prescan, chat-coherent).
defaults:
- /base
- /task: natural_domains_arithmetic_weekdays
- /model: tiny-random
- /analysis/baseline   # locate looks up baseline accuracy + ref dists if cached
- /analysis/locate
- _self_

task:
  target_variable: result
  n_train: 2
  n_test: 2

baseline:
  batch_size: 2

locate:
  layers: [0, 1]
  n_steer: 2
  batch_size: 2
  prescan:
    enabled: true
    top_k: 3          # 2 layers x 3 task positions = 6 cells; exact runs on 3
    n_examples: 2

# Artifacts asserted by test_smoke.py::test_runner_smoke, relative to
# experiment_root.
expected_artifacts:
- locate/interchange/metadata.json
- locate/interchange/results.json
- locate/interchange/result/results.json
