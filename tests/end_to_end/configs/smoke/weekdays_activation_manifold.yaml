# @package _global_
# Smoke-tier activation_manifold runner for weekdays.
#
# Smoke configs pin `/model: tiny-random` and assert only that the runner
# completes and writes its declared `expected_artifacts`. See docs/TESTS.md
# "Smoke vs golden split".
defaults:
- /base
- /task: natural_domains_arithmetic_weekdays
- /model: tiny-random
- /analysis/baseline
- /analysis/locate
- /analysis/subspace
- /analysis/activation_manifold
- _self_

task:
  target_variable: result
  # enumerate_all + n_train >= n_unique_inputs (49 for weekdays) gives every
  # class non-empty training samples → distinct per-class subspace centroids
  # → spline control points don't collapse to duplicates.
  n_train: 49
  n_test: 2

baseline:
  batch_size: 8

locate:
  layers: [1]
  n_steer: 4
  batch_size: 8

subspace:
  filter_correct: false  # tiny-random solves ~nothing; correct-only filtering would empty the dataset
  k_features: 8
  layers: [1]
  token_positions: [last_token]   # explicit single-cell position (#257)
  batch_size: 8

activation_manifold:
  layers: [1]
  batch_size: 8
  # intrinsic_dim must match the task's number of causal parameters
  # (weekdays → 1). Spline method enforces this.
  intrinsic_dim: 1
  n_grid: 5

expected_artifacts:
- activation_manifold/pca_k8/L1_last_token/spline_s0.0/result/metadata.json
