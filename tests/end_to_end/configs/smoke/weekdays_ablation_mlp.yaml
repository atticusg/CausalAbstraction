# @package _global_
# Smoke-tier ablation runner for weekdays — MLP, mean-ablation, named span.
#
# Pairs with weekdays_ablation_heads.yaml to cover the other component type,
# the mean reference (corpus-mean collection), and a named token-position span.
defaults:
- /base
- /task: natural_domains_arithmetic_weekdays
- /model: tiny-random
- /analysis/ablation
- _self_

task:
  target_variable: result
  n_train: 2
  n_test: 2

ablation:
  component_type: mlp
  mode: mean
  span: [last_token]
  layers: [0, 1]
  batch_size: 2
  complement_keep: [0]   # keep layer 0, ablate the rest (exercises the sufficiency path)

expected_artifacts:
- ablation/mlp_mean_last_token/metadata.json
- ablation/mlp_mean_last_token/results.json
- ablation/mlp_mean_last_token/heatmap.png
