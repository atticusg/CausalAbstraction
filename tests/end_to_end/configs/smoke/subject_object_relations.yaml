# @package _global_
# Smoke-tier baseline runner; coverage-oriented, not a scientific run.
# tiny-random + existence-only asserts (see docs/TESTS.md "Smoke vs golden split").
# Uses the small stripped-meta bias relation `name_gender` (18 subjects, 2 objects,
# 3 templates) so the object-flip counterfactual path runs on CPU with garbage
# output; accuracy is not asserted here (that is the golden tier's job).
defaults:
- /base
- /task: subject_object_relations
- /model: tiny-random
- /analysis/baseline
- _self_

task:
  relation: name_gender
  target_variable: object
  n_train: 2
  n_test: 2

baseline:
  batch_size: 2

expected_artifacts:
- baseline/metadata.json
- baseline/accuracy.json
