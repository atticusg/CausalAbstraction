# @package _global_
# Smoke-tier baseline runner; coverage-oriented, not a scientific run.
# tiny-random + existence-only asserts (see docs/TESTS.md "Smoke vs golden split").
# Scores the option letter (the task default); the value-scored mcqa golden
# lives under configs/golden/ on chat-coherent.
defaults:
- /base
- /task: MCQA
- /model: tiny-random
- /analysis/baseline
- _self_

task:
  target_variable: answer
  n_train: 2
  n_test: 2

baseline:
  batch_size: 2

expected_artifacts:
- baseline/metadata.json
- baseline/accuracy.json
