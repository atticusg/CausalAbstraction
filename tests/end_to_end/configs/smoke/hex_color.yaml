# @package _global_
# Smoke-tier baseline runner; coverage-oriented, not a scientific run.
# tiny-random + existence-only asserts (see docs/TESTS.md "Smoke vs golden split").
# Accuracy is garbage on random-init weights; the value-pinned accuracy gate lives
# in the chat-coherent golden (configs/golden/hex_color.yaml).
defaults:
- /base
- /task: hex_color
- /model: tiny-random
- /analysis/baseline
- _self_

task:
  target_variable: color
  n_train: 2
  n_test: 2

baseline:
  batch_size: 2

expected_artifacts:
- baseline/metadata.json
- baseline/accuracy.json
