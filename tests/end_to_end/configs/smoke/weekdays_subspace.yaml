# @package _global_
# Smoke-tier subspace runner for weekdays.
#
# Smoke configs pin `/model: tiny-random` and assert only that the runner
# completes and writes its declared `expected_artifacts`. See docs/TESTS.md
# "Smoke vs golden split".
defaults:
- /base
- /task: natural_domains_arithmetic_weekdays
- /model: tiny-random
- /analysis/baseline
- /analysis/locate    # subspace auto-discovers its layers from locate when null
- /analysis/subspace
- _self_

task:
  target_variable: result
  n_train: 2
  n_test: 2

baseline:
  batch_size: 2

locate:
  layers: [0, 1]
  n_steer: 2
  batch_size: 2

subspace:
  filter_correct: false  # tiny-random solves ~nothing; correct-only filtering would empty the dataset
  # tiny-random has hidden_size=16, so PCA can fit at most 16 components.
  k_features: 8
  layers: [1]
  token_positions: [last_token]   # explicit single-cell position (#257)
  batch_size: 2

expected_artifacts:
- subspace/pca_k8/result/metadata.json
