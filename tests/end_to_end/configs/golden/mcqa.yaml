# @package _global_
# Chat-mode locked-values baseline for tests/end_to_end/goldens — chat-coherent
# (Qwen3-4B-Instruct-2507). An instruct model fed an MCQA prompt is bimodal: it
# answers most questions with the choice *value* (the colour "orange") and a
# minority with the option *letter* ("Y") — 24/30 vs 6/30 at seed 0, exactly
# disjoint. The default letter contract scores 0.2 and colour-only scores 0.8;
# `score_by: value` accepts *either* notation (both name the right choice),
# clearing the 0.9 floor at 30/30. See SCORE_MODES in
# causalab/tasks/MCQA/causal_models.py; all colours and A/B letters are
# single-token, so max_new_tokens stays 1 and prob_accuracy stays defined.
# Device follows the fixture (`auto` → CUDA when available, CPU otherwise).
defaults:
- /base
- /task: MCQA
- /model: chat-coherent
- /analysis/baseline
- _self_

task:
  target_variable: answer
  score_by: value
  n_train: 30
  n_test: 30

baseline:
  batch_size: 8
