# @package _global_
# Chat-mode locked-values baseline for tests/end_to_end/goldens — chat-coherent
# (Qwen3-4B-Instruct-2507). Relation `word_first_letter` was selected by the
# curation sweep (causalab/tasks/subject_object_relations/data/curation_sweep.py):
# it is the strongest green relation — 25 single-token, first-token-distinct
# answer letters and 1.000 base accuracy under the chat template + answer
# directive (see README.md curation table). objects are graded first-token /
# prefix-aware (match_modes={"object": "prefix"}); all answers are single letters
# so max_new_tokens stays 1 and prob_accuracy stays defined.
# Device follows the fixture (`auto` → CUDA when available, CPU otherwise).
defaults:
- /base
- /task: subject_object_relations
- /model: chat-coherent
- /analysis/baseline
- _self_

task:
  relation: word_first_letter
  target_variable: object
  n_train: 50
  n_test: 16

baseline:
  batch_size: 8
