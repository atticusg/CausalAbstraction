# @package _global_
# Golden-tier attention_pattern runner for MCQA — chat-coherent (Qwen3-4B-Instruct-2507).
#
# Golden-only (no smoke twin): attention_pattern's _generate_correct_examples keeps
# only examples the model predicts correctly, which a random-init tiny-random model
# can never produce — so this analysis is not smoke-viable and lives solely on the
# coherent (GPU) tier. Promoted from configs/runners/demos/attention_pattern_demo.yaml
# (onboarding nb 08): llama32_1b_instruct → chat-coherent. max_attempts is raised
# 100 → 200 because chat-coherent answers MCQA bimodally — most replies give the
# choice *value* ("orange"), a minority the option *symbol* (" A"); only the symbol
# replies match raw_output (= " " + answer), so a wider sampling budget reliably
# yields the n_examples correct symbol-format examples (~20% of replies, all correct;
# see configs/golden/mcqa.yaml).
#
# This golden pins ZERO numerical values by design: extract_values() reads
# baseline/accuracy.json and *.safetensors reductions, but attention_pattern emits
# only figures (PNG) + JSON statistics, and no baseline is composed here (adding one
# would merely duplicate the pins already in configs/golden/mcqa.yaml). So this acts
# as the end-to-end "attention_pattern runs to completion on a coherent model" gate —
# test_goldens.py always re-runs the runner (any crash / contract drift fails it),
# the empty value set just skips the within-tolerance comparison. It is the coherent
# replacement for the deleted structural integration tests, which likewise asserted
# pipeline shape, not values. See docs/TESTS.md "Smoke vs golden split".
defaults:
- /base
- /task: MCQA
- /model: chat-coherent
- /analysis/attention_pattern
- _self_

task:
  target_variable: answer_position

attention_pattern:
  layers: [14]           # scan a single mid-network layer for a bounded golden
  heads: null            # null = all heads in that layer
  n_examples: 8
  max_attempts: 200
  source_token_types: ["last_token"]
  target_token_types: ["correct_symbol", "symbol0", "symbol1"]
  ignore_first_token: true
  visualization:
    figure_format: png
    per_head_heatmaps: true
    average_heatmaps: true
    statistics_charts: true
    token_type_heatmaps: true
    head_comparison_grid: true
