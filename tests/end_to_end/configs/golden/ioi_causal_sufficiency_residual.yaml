# @package _global_
# Golden-tier causal-sufficiency (ROME-style causal tracing) runner for IOI —
# residual-stream restore, noise corruption of the subject span, logit-diff
# (IO vs the repeated subject name_C) recovery metric, on GPT-2 small.
#
# Model = GPT-2 (NOT chat-coherent), mirroring tests/.../golden/ioi_path_patching
# .yaml. This is deliberate and load-bearing for the metric: the causal-
# sufficiency prob/logit/logit_diff metrics read ONE answer-token id per example
# via `single_token_id`, which returns the *space-prefixed* form (" Bob") — the
# token a base LM emits at a word boundary. chat-coherent (Qwen3-4B-Instruct)
# wraps every prompt in its chat template and emits the *bare* answer token
# ("Bob", a different id), so on chat-coherent these metrics read ~0 probability
# and the recovery grid collapses to noise (verified empirically). GPT-2 is a
# base model that emits the leading-space token AND actually does IOI (Wang et
# al. 2022), so the logit-diff ceiling/floor and the recovery grid carry real
# signal. GPT-2 is also tiny (124M) — the small restore grid runs well within
# the golden <10 min budget. Every IOI name is single-token under GPT-2 (all 99
# space-prefixed forms encode to one token), so the per-example metric never
# crashes on a multi-token answer (the failure mode that keeps IOI + this metric
# off the tiny-random smoke tier — there the answer task is alphabet instead).
#
# Promoted from the residual smoke design (corruption noise over name_C, restore
# residual layers at last_token), scaled up: tiny-random -> gpt2, n_test 2 -> 32,
# batch_size 2 -> 16 (following the ioi_path_patching IOI golden scale).
# extract_values() pins every float leaf of results.json (clean_ceiling,
# corrupted_floor, recovery_grid, top_k_cells), so no expected_artifacts: block —
# the smoke twin keeps that CPU-side. See docs/TESTS.md "Smoke vs golden split"
# and "Golden JSON contract".
defaults:
- /base
- /task: IOI
- /model: gpt2
- /analysis/causal_sufficiency
- _self_

task:
  target_variable: IO
  n_test: 32

causal_sufficiency:
  corruption:
    kind: noise            # ROME 3-sigma per-token Gaussian over the subject span
    layer: -1              # embedding / block-0 input entry site
    span: [name_C]         # the repeated subject name (ROME corrupts the subject)
    noise_scale: 3.0
    noise_seed: 0
  restore:
    component_type: residual
    layers: [0, 1, 2]      # small slice of GPT-2's 12 layers (golden budget)
    span: [last_token]     # single-token readout position
    window: 1
  metric:
    kind: logit_diff
    correct_variable: IO       # the indirect object the model should emit
    distractor_variable: name_C  # the repeated subject name
  normalize: recovery
  batch_size: 16
