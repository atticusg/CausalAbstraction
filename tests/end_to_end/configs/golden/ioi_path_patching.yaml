# @package _global_
# Golden-tier path-patching head sweep: IOI direct-effect-on-logits on GPT-2 small.
#
# This is the paper-faithful IOI replication that path patching exists for (Wang
# et al. 2022 §3.1 / pyvene IOI tutorial), pinned as a value golden. It mirrors
# configs/runners/IOI/ioi_gpt2_path_patching.yaml verbatim — full (layer x head)
# sweep on GPT-2 small, ABC corruption, restore=[attention] (MLPs/LayerNorm
# recompute), logit diff = IO vs the repeated subject (name_C).
#
# Why GPT-2 (not the chat-coherent golden model): path patching's headline result
# IS the IOI head map, and GPT-2 small is the model where it is interpretable and
# sign-checkable against the paper — name-mover heads (9.6, 9.9, 10.0) score
# large-positive and negative name-movers (10.7, 11.10) score negative. A 4B chat
# model on raw IOI prompts would not reproduce that structure, so the pinned
# numbers would carry no validation signal. GPT-2 small is also tiny (124M), so
# the full 12x12 sweep is cheap on the single H100 golden runner.
#
# extract_values() pins every finite float leaf of path_patching/<...>/results.json
# — i.e. the full effect_grid (per (layer,head) direct effect) plus the top_k cell
# effects. GPU bootstrap pins deterministic:false; per-key tolerances carry the
# (negligible, same-runner) kernel-drift signal. See docs/TESTS.md "Golden JSON
# contract" and docs/PATH_PATCHING.md §9 (worked IOI example).
defaults:
- /base
- /task: IOI
- /model: gpt2
- /analysis/path_patching
- _self_

task:
  n_test: 64

path_patching:
  layers: null            # all 12 layers — the full IOI head map
  heads: null             # all 12 heads
  restore: [attention]    # paper §3.1 direct effect (MLPs/LayerNorm recompute)
  corruption: abc         # all three names -> distinct randoms (paper §3.1)
  correct_variable: IO
  distractor_variable: name_C
  relative_to_base: true
  batch_size: 16
