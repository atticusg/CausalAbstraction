# @package _global_
# Golden-tier ablation runner for weekdays — MLP, mean-ablation, named span,
# chat-coherent (Qwen3-4B-Instruct-2507).
#
# Promoted from configs/smoke/weekdays_ablation_mlp.yaml: tiny-random →
# chat-coherent, n_train 2 → 49 (enumerate_all: train == test == the full 7×7
# weekday input space; the corpus-mean reference is collected over that train
# split), batch_size 2 → 8. Pairs with weekdays_ablation_heads.yaml to pin the
# other component type, the mean reference (multi-position MLP mean collection —
# the central fix in this PR), a named token-position span, and the
# complement_keep sufficiency path. Pins base_accuracy + drop_grid + the
# `complement` drop via extract_values() (results.json float leaves), so no
# `expected_artifacts:` block. See docs/TESTS.md "Smoke vs golden split".
defaults:
- /base
- /task: natural_domains_arithmetic_weekdays
- /model: chat-coherent
- /analysis/ablation
- _self_

task:
  target_variable: result
  n_train: 49
  n_test: 2

ablation:
  component_type: mlp
  mode: mean
  span: [last_token]
  layers: [0, 1]
  batch_size: 8
  complement_keep: [0]   # keep layer 0, ablate the rest (exercises the sufficiency path)
