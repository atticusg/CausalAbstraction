# @package _global_
# Golden-tier fixed-subspace mediation scoring for weekdays — chat-coherent (Qwen3-4B-Instruct-2507).
#
# Ships #262: SCORE a given rotation's causal mediation, not just thread it. The
# `pca` mode fits a rotation at (L1, number); the `fixed` mode threads THAT
# rotation back in (fixed.artifact -> the pca mode's rotation.safetensors) with
# `score: true`, writing subspace_score / full_cell_score (unrestricted control) /
# score_ratio to its results.json. Modes run sequentially, so `pca` writes the
# rotation before `fixed` reads it; ${experiment_root} resolves through the
# per-mode merge. extract_values pins the results.json float leaves; no
# `expected_artifacts:` block (this is a value-pin golden).
#
# Stability / why the score-key tolerances in the golden JSON are wide:
# n_train 49 fires the task's enumerate_all branch, so train == test == the full
# deterministic 7x7 input space, and token_positions: [number] is a strong mediator
# (locate pins kl ~= 10.9 there at L1) — both chosen to keep the score meaningful
# and the dataset fixed. The dataset and PCA-rotation reductions are reproducible
# (mean/std/... wash out per-element drift, like every other subspace golden), so
# they stay at the tight default tolerance. But the three *kl interchange scores*
# (subspace_score / full_cell_score / score_ratio) are intrinsically jittery on the
# multi-node bf16-GPU fleet: the full-residual patch hits a non-deterministic CUDA
# scatter (NOT fixed by torch.use_deterministic_algorithms — no deterministic
# kernel) and kl's log-ratios amplify it, while the PCA rotation differs across
# nodes (bf16 forward-activation drift -> different SVD). Measured cross-node spread
# ~1.5 on the ~12-nat scores and ~0.07 on the ratio, so the golden JSON widens just
# those three keys (3.0 / 3.0 / 0.2) — the scoring *code* adds no nondeterminism.
# This same fragility latently affects the existing locate/subspace kl goldens. See
# docs/TESTS.md "Smoke vs golden split".
defaults:
- /base
- /task: natural_domains_arithmetic_weekdays
- /model: chat-coherent
- /analysis/baseline
- /analysis/subspace
- _self_

task:
  target_variable: result
  n_train: 49
  n_test: 2

baseline:
  batch_size: 8

subspace:
  filter_correct: false  # golden pins the unfiltered pipeline; a filter_correct:true golden needs a nightly re-pin
  k_features: 8
  layers: [1]
  token_positions: [number]
  batch_size: 8
  modes:
  - name: pca
    method: pca
  - name: fixed
    method: fixed
    fixed:
      artifact: ${experiment_root}/subspace/pca_k8/pca/result/rotation.safetensors
      score: true
