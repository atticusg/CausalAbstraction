# @package _global_
# Golden-tier pullback runner for weekdays — chat-coherent
# (Qwen3-4B-Instruct-2507). A full golden: value pins (extracted tensor
# reductions across the chain) + determinism.
#
# Golden-only (no smoke coverage) by nature: pullback REQUIRES output_manifold
# (no fallback) and uses subspace + activation_manifold. output_manifold needs
# coherent per-class output distributions to fit the Hellinger TPS — random-init
# logits collapse the centroids to duplicates and the spline solver legitimately
# fails. So the whole chain needs a coherent model → GPU → golden. See
# docs/TESTS.md "Smoke vs golden split".
#
# Reruns are byte-identical at a fixed seed *on the same node* (confirmed: two
# same-node reruns of the whole chain, incl. the LBFGS embedding optimisation,
# match to the bit). ACROSS NODES, bf16 kernel selection on the multi-node H100
# fleet drifts the single-element point-reductions (`.first`/`.last`) of the
# near-zero / loss-trajectory tensors by ~1e-5, while the aggregate reductions
# (`.mean`/`.std`) stay stable to ~1e-6. The measured worst-case cross-node drift
# is 1.1e-5 (on `optimization_results/.../per_step_loss.last`), which tripped the
# original flat 1e-5 default. The golden JSON therefore widens `default` to 1e-4
# (~9x margin) — the O(0.1-1) structural values stay pinned to <=0.1% relative
# (a real pullback regression moves them far more), and the jittery point-
# reductions no longer flap the nightly. This is the same cross-node bf16
# fragility documented in weekdays_fixed_subspace.yaml; the pullback *code* adds
# no nondeterminism. See docs/TESTS.md "Golden JSON contract".
defaults:
- /base
- /task: natural_domains_arithmetic_weekdays
- /model: chat-coherent
- /analysis/baseline
- /analysis/locate
- /analysis/subspace
- /analysis/activation_manifold
- /analysis/output_manifold
- /analysis/pullback
- _self_

task:
  target_variable: result
  n_train: 49
  n_test: 2

baseline:
  batch_size: 8

locate:
  layers: [1]
  n_steer: 4
  batch_size: 8

subspace:
  # Keep k_features small for speed (well under the model's hidden_size).
  k_features: 8
  layers: [1]
  token_positions: [last_token]   # explicit single-cell position (#257)
  batch_size: 8

activation_manifold:
  layers: [1]
  batch_size: 8
  intrinsic_dim: 1
  n_grid: 5

output_manifold:
  batch_size: 8
  intrinsic_dim: 1

pullback:
  max_pairs: 2
  n_prompts: 2
  batch_size: 8
  belief_path:
    n_steps: 4
  embedding_optim:
    n_steps: 4
    k_opt: 8
    init: linear
    lbfgs:
      steps: 4
      max_iter: 2
