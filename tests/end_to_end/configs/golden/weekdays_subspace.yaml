# @package _global_
# Golden-tier subspace runner for weekdays — chat-coherent (Qwen3-4B-Instruct-2507).
#
# Promoted from configs/smoke/weekdays_subspace.yaml: tiny-random → chat-coherent,
# n_train 2 → 49 (fires the enumerate_all branch — deterministic 7×7 input space),
# batch_size 2 → 8. Adds a `modes:` sweep so one runner exercises all four subspace
# methods, covering onboarding nb 04 (DAS/DBM), nb 05 (PCA/DBM/DAS) and nb 06
# (boundless DAS). Each mode inherits the analysis-level k_features/layers/batch_size
# and overrides only `method`; artifacts land under subspace/<mode.name>/. The smoke
# twin stays for CPU coverage; this golden pins values via extract_values() (no
# `expected_artifacts:` block). See docs/TESTS.md "Smoke vs golden split".
defaults:
- /base
- /task: natural_domains_arithmetic_weekdays
- /model: chat-coherent
- /analysis/baseline
- /analysis/locate    # subspace auto-discovers its layers from locate when null
- /analysis/subspace
- _self_

task:
  target_variable: result
  n_train: 49
  n_test: 2

baseline:
  batch_size: 8

locate:
  layers: [0, 1]
  n_steer: 2
  batch_size: 8

subspace:
  filter_correct: false  # golden pins the unfiltered pipeline; a filter_correct:true golden needs a nightly re-pin
  k_features: 8
  layers: [1]
  token_positions: [last_token]   # explicit single-cell position (#257)
  batch_size: 8
  modes:
  - name: pca
    method: pca
  - name: das
    method: das
  - name: dbm
    method: dbm
  - name: boundless
    method: boundless
