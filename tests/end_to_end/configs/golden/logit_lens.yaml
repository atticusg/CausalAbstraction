# @package _global_
# Golden-tier logit-lens runner for weekdays — chat-coherent (Qwen3-4B-Instruct-2507).
#
# Promoted from configs/smoke/logit_lens.yaml: tiny-random → chat-coherent,
# n_train 2 → 49 (fires the task's enumerate_all branch — train == test == the
# full 7×7 weekday input space, deterministic, no sampling). Pins the
# nnterp-routed logit-lens path (project_on_vocab via StandardizedTransformer,
# #461) via the harness's extract_values() over the saved top_k / target_track
# tensors — so no `expected_artifacts:` block.
#
# NOTE (repo convention): this config ships WITHOUT a
# tests/end_to_end/goldens/logit_lens.json — the golden harness enumerates
# goldens/*.json, so it is inert until the JSON is bootstrapped on the nightly
# h100 via:
#   uv run python tests/end_to_end/update_goldens.py --init --i-have-reviewed-the-diff
# (or `--baseline golden/logit_lens`). Value pins need that same-GPU run.
defaults:
- /base
- /task: natural_domains_arithmetic_weekdays
- /model: chat-coherent
- /analysis/logit_lens
- _self_

task:
  target_variable: result
  n_train: 49
  n_test: 2

logit_lens:
  layers: [0, 1]
  top_k: 5
  batch_size: 8
  visualization:
    heatmap: false
