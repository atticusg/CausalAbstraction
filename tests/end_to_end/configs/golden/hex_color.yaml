# @package _global_
# Chat-mode locked-values baseline for tests/end_to_end/goldens — chat-coherent
# (Qwen3-4B-Instruct-2507). The task is a fixed 6-way colour classification: the
# answer *is* the colour word, so the default scoring path already scores "the
# value" (no `score_by` mode needed, unlike MCQA) via the output_tokens-derived
# checker (all six colours are single-token — no bespoke checker.py).
# `balanced: true` gives all six classes equal weight (5 each at n_train=30).
#
# The source dataset had a seventh class, `indigo` (hue 258°), dropped because
# Qwen3-4B labels indigo swatches "purple" ~0.999-confident, which capped
# 7-colour accuracy at ~0.80 (< the 0.9 floor). With indigo removed the six
# remaining colours are perceptually separable and clear the gate — see the
# pinned tests/end_to_end/goldens/hex_color.json (accuracy >= 0.9). Device
# follows the fixture (`auto` -> CUDA when available, CPU otherwise); GPU
# bootstrap pins `deterministic: false`.
defaults:
- /base
- /task: hex_color
- /model: chat-coherent
- /analysis/baseline
- _self_

task:
  target_variable: color
  n_train: 30
  n_test: 30
  balanced: true

baseline:
  batch_size: 8
