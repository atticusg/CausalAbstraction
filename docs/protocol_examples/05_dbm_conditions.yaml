# DBM (differential binary masking) — "conditions" variant.
# A plain swap through a gate featurizer computes
#   sigma(theta) * x_src + (1 - sigma(theta)) * x_base;
# training theta under L1 with a temperature anneal recovers the mask.
version: "1"
model:      {key: meta-llama/Llama-3.1-8B, revision: main}
high_level: {key: weekdays.causal_model}

data:
  base:   {dataset: "weekdays/train@9ab2", field: input}
  source: {dataset: "weekdays/train@9ab2", field: "counterfactual_inputs[0]"}

sites:
  target: {component: block_output, layer: 18}

featurizers:
  gate: {kind: gate, shape: [4096]}

interventionals:
  v_src:  {site: target,  pos: -1, input: source, featurizer: gate}
  mask:   {site: target,  pos: -1, input: base,   featurizer: gate, do: {swap: v_src}}
  logits: {site: lm_head, pos: -1, input: base, conditions: [mask]}

metrics:
  iia: {kind: logit_diff,    of: logits, a: cf_answer, b: base_answer}
  ce:  {kind: cross_entropy, of: logits, target: label}

train:
  objective:  [[1.0, ce], [0.01, {l1: gate.theta}]]
  params:     [gate.theta]
  optimizer:  {name: adamw, lr: 1.0e-3, weight_decay: 0.0}
  steps:      {epochs: 20}
  batch:      {pairs: 16}
  anneal:     {gate.theta.temperature: [1.0, 0.01, 0.5]}
  precision:  {feature: fp32, loss: fp32, model: bf16}
  eval:       {every: {epochs: 1}, split: "weekdays/test@9ab2", metrics: [iia]}
  early_stop: {metric: iia, patience: 3, mode: max}
  seed: 0
