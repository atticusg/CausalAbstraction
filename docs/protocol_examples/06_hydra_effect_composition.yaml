# The Hydra effect (McGrath et al. 2023, arXiv:2307.15771), main experiment —
# "composition" variant. Same design as the conditions variant; see the header
# there for the method and its approximations.
version: "1"
model: {key: meta-llama/Llama-3.1-8B, revision: main}

data:
  base:   {dataset: "pile/sample@71e0", field: input}
  source: {dataset: "pile/sample@71e0", field: resample_input}

sites:
  abl:         {component: attention_output, layer: 13}
  probe14:     {component: attention_output, layer: 14}
  probe20:     {component: attention_output, layer: 20}
  resid_final: {component: block_output, layer: 31}

compositions:
  ablated: {edits: [resample]}
  de14c:   {edits: [inj14_clean]}
  de20c:   {edits: [inj20_clean]}
  de14a:   {edits: [inj14_abl]}
  de20a:   {edits: [inj20_abl]}

reads:
  v_noise:      {site: abl,     pos: -1, in: source}
  logits_clean: {site: lm_head, pos: -1, in: base}
  logits_abl:   {site: lm_head, pos: -1, in: ablated}
  a14_clean:    {site: probe14, pos: -1, in: base}
  a20_clean:    {site: probe20, pos: -1, in: base}
  a14_abl:      {site: probe14, pos: -1, in: ablated}
  a20_abl:      {site: probe20, pos: -1, in: ablated}
  de14_clean:   {site: lm_head, pos: -1, in: de14c}
  de20_clean:   {site: lm_head, pos: -1, in: de20c}
  de14_abl:     {site: lm_head, pos: -1, in: de14a}
  de20_abl:     {site: lm_head, pos: -1, in: de20a}

edits:
  resample:     {site: abl,         pos: -1, do: {swap: v_noise}}
  inj14_clean:  {site: resid_final, pos: -1, do: {swap: a14_clean}}
  inj20_clean:  {site: resid_final, pos: -1, do: {swap: a20_clean}}
  inj14_abl:    {site: resid_final, pos: -1, do: {swap: a14_abl}}
  inj20_abl:    {site: resid_final, pos: -1, do: {swap: a20_abl}}

metrics:
  te_clean: {kind: token_logit, of: logits_clean, token: ml_token}
  te_abl:   {kind: token_logit, of: logits_abl,   token: ml_token}
  de14_c:   {kind: token_logit, of: de14_clean,   token: ml_token}
  de20_c:   {kind: token_logit, of: de20_clean,   token: ml_token}
  de14_a:   {kind: token_logit, of: de14_abl,     token: ml_token}
  de20_a:   {kind: token_logit, of: de20_abl,     token: ml_token}
