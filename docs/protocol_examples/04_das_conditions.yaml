# DAS — "conditions" variant.
# Interchange through a trained 8-dim orthogonal subspace at L18; the rotation
# weight rot.weight is auto-declared from the featurizer kind (the cayley
# parametrization's internal shape is its own business, never authored).
version: "1"
model:      {key: meta-llama/Llama-3.1-8B, revision: main}
high_level: {key: weekdays.causal_model}

data:
  base:   {dataset: "weekdays/train@9ab2", field: input}
  source: {dataset: "weekdays/train@9ab2", field: "counterfactual_inputs[0]"}

sites:
  target: {component: block_output, layer: 18}

featurizers:
  rot: {kind: subspace, shape: [4096, 8], parametrization: cayley}

interventionals:
  v_src:  {site: target,  pos: -1, input: source, featurizer: rot}
  patch:  {site: target,  pos: -1, input: base,   featurizer: rot, do: {swap: v_src}}
  logits: {site: lm_head, pos: -1, input: base, conditions: [patch]}

metrics:
  iia: {kind: logit_diff,    of: logits, a: cf_answer, b: base_answer}
  ce:  {kind: cross_entropy, of: logits, target: label}

train:
  objective:  [[1.0, ce]]
  params:     [rot.weight]
  optimizer:  {name: adamw, lr: 1.0e-3, weight_decay: 0.0}
  steps:      {epochs: 10}
  batch:      {pairs: 16}
  precision:  {feature: fp32, loss: fp32, model: bf16}
  eval:       {every: {epochs: 1}, split: "weekdays/test@9ab2", metrics: [iia]}
  early_stop: {metric: iia, patience: 3, mode: max}
  seed: 0
